name: SONIC Passwordless Owner Access
on:
  push:
    branches: ['feat/sonic-passkeys-*']
  pull_request:
    paths:
      - 'sonic/passkeys.py'
      - 'sonic/passkey_ui.py'
      - 'sonic/auth.py'
      - 'sonic/api.py'
      - 'requirements.txt'
      - 'web/passkey-login.*'
      - 'tests/test_passkey*.py'
      - 'scripts/e2e_passkeys.py'
      - '.github/workflows/passkeys-v130.yml'
permissions:
  contents: read
jobs:
  security-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install tested dependencies and browser
        run: |
          python -m pip install -r requirements.txt playwright==1.56.0
          python -m pip check
          python -m playwright install --with-deps chromium
      - name: Real cryptographic and existing control-plane regressions
        run: |
          python -m compileall -q sonic scripts
          python -m pytest -q
          node --check web/passkey-login.js
          node --test tests/js/*.test.cjs
      - name: Native browser enrollment and sign-in without owner token
        run: python scripts/e2e_passkeys.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonic-passkey-browser
          path: artifacts/passkeys-v130/
          retention-days: 7
          if-no-files-found: warn
  postgres-security:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sonic_ci
          POSTGRES_PASSWORD: synthetic-passkey-ci-only
          POSTGRES_DB: sonic_passkey_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sonic_ci -d sonic_passkey_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install server test dependencies
        run: python -m pip install -r requirements.txt
      - name: Prove atomic security transitions on isolated PostgreSQL
        env:
          SONIC_PASSKEY_TEST_POSTGRES_URL: postgresql+psycopg://sonic_ci:synthetic-passkey-ci-only@127.0.0.1:5432/sonic_passkey_ci
        run: python -m pytest -q tests/test_passkey_postgres.py
