name: SONIC Software Manager

on:
  push:
    branches: ['feat/sonic-software-manager-*']
  pull_request:
    paths:
      - 'sonic/**'
      - 'scripts/windows_*'
      - 'scripts/Install-Sonic-Companion.ps1'
      - 'scripts/e2e_software.py'
      - 'web/**'
      - 'tests/**'
      - '.github/workflows/software-manager.yml'

permissions:
  contents: read

jobs:
  cloud-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Validate server, broker, and browser contracts
        run: |
          python -m compileall -q sonic scripts
          python -m pytest -q
          node --check web/software-manager.js
          node --test tests/js/software-manager.test.cjs
      - name: Verify approval and receipts with a synthetic Windows companion
        run: python scripts/e2e_software.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonic-software-manager-browser
          path: artifacts/software-manager/
          if-no-files-found: warn
          retention-days: 7

  windows-contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Test broker and companion without executing installers
        run: python -m pytest -q tests/test_windows_software.py tests/test_software_integration.py
      - name: Parse companion installer without running it
        shell: pwsh
        run: |
          $sonicTokens=$null
          $sonicErrors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/Install-Sonic-Companion.ps1),[ref]$sonicTokens,[ref]$sonicErrors)|Out-Null
          if($sonicErrors.Count -gt 0){ $sonicErrors | ForEach-Object { Write-Error $_.Message }; exit 1 }
