name: SONIC V0.8 PC Command Center

on:
  push:
    branches:
      - feature/sonic-pc-command-center-v08-20261026
      - feature/sonic-chat-first-actions-v082-20261026
      - feature/sonic-voice-desktop-bridge-v083-20261026
      - feature/sonic-voice-command-v084-20261026
      - fix/sonic-voice-dispatch-audit-v085-20261026
      - feature/sonic-integration-brain-v086-20261026
      - feature/sonic-execution-engine-v087-20261026
  pull_request:
    paths:
      - 'sonic/**'
      - 'web/**'
      - 'scripts/windows_*'
      - 'scripts/e2e_pc_v08.py'
      - 'tests/**'
      - '.github/workflows/pc-command-v08.yml'

permissions:
  contents: read

jobs:
  server-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and Chromium
        run: |
          python -m pip install -r requirements.txt playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Compile and regression tests
        run: |
          python -m compileall -q sonic scripts
          python -m pytest -q
          node --check web/app.js
          node --check web/pc-command-v08.js
          node --test tests/js/*.test.cjs
      - name: Synthetic PC owner approval and stream browser E2E
        run: python scripts/e2e_pc_v08.py
      - name: Voice transcript Desktop actions and same-chat approval on Chrome
        run: python scripts/e2e_voice_desktop_v083.py
      - name: Integration particle, executor registry and mobile browser QA
        run: python scripts/e2e_integrations_v086.py
      - name: Durable execution engine, lost-response retry and result evidence
        run: python scripts/e2e_execution_v087.py
      - name: Neural Brain and dark theme regression
        run: python scripts/e2e_motion_v072.py
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonic-pc-v08-qa
          path: |
            artifacts/pc-v08/
            artifacts/motion-v072/
            artifacts/voice-desktop-v083/
            artifacts/integrations-v086/
            artifacts/execution-v087/
          if-no-files-found: warn
          retention-days: 7

  windows-command-broker:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install process guard dependency
        run: python -m pip install psutil
      - name: Windows PowerShell, stream, timeout, cancellation
        run: python scripts/qa_windows_broker_v08.py
