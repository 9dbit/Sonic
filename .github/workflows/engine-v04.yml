name: SONIC Engine V04
on:
  push:
    branches: ['feature/sonic-engine-v04-20261025']
  pull_request:
    paths: ['sonic/**', 'web/**', 'tests/**', 'scripts/**', '.github/workflows/engine-v04.yml']
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reproducible source archive (tracked files only)
        run: git archive --format=tar.gz --output=sonic-engine-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: sonic-engine-source
          path: sonic-engine-source.tar.gz
          retention-days: 7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test engine and media lifecycle
        run: |
          python -m pytest -q
          python -m compileall -q sonic scripts
          node --check web/app.js
          node --check web/graph.js
          node --check web/engine-ui.js
          node --check web/voice.js
          node --test tests/js/*.test.cjs
      - name: Desktop and mobile HTTP browser workflow (synthetic provider)
        run: python scripts/e2e_engine.py
      - name: QA evidence (disposable test data only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonic-engine-v04-qa
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
