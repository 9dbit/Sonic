name: SONIC Neural Memory QA
on:
  push:
    branches:
      - 'feature/sonic-memory-neural-20261025'
      - 'feature/sonic-foundation-20261024'
    paths:
      - 'sonic/**'
      - 'web/**'
      - 'tests/**'
      - 'scripts/e2e_neural.py'
      - '.github/workflows/neural-memory.yml'
  pull_request:
jobs:
  memory-graph-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sonic_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: sonic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sonic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Compile and check scripts
        run: |
          python -m compileall -q sonic scripts
          node --check web/app.js
          node --check web/graph.js
      - name: Regression and disposable PostgreSQL tests
        run: python -m pytest -q
        env:
          SONIC_TEST_POSTGRES_URL: postgresql+psycopg://sonic_test:disposable_ci_only@localhost:5432/sonic_test
      - name: Real HTTP and desktop/mobile browser workflow
        run: python scripts/e2e_neural.py
      - name: Upload QA evidence (synthetic data only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonic-neural-memory-qa
          path: artifacts/
          if-no-files-found: warn
