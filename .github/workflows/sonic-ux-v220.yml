name: SONIC v2.2 Premium UI Acceptance
on:
  pull_request:
    paths:
      - 'web/sonic-ux-v220.*'
      - 'web/sonic-ux-v230.css'
      - 'web/sonic-ux-v231.css'
      - 'web/sonic-ux-v231.js'
      - 'tests/test_ui_v231.py'
      - 'scripts/e2e_ui_v231.py'
      - 'web/motion-core.js'
      - 'web/sonic-mark.svg'
      - 'tests/test_ui_v230.py'
      - 'web/index.html'
      - 'web/graph.js'
      - 'scripts/e2e_ui_v220.py'
      - '.github/workflows/sonic-ux-v220.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  javascript-syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate both JavaScript engines
        run: |
          node --check web/sonic-ux-v220.js
          node --check web/motion-core.js
          node --check web/sonic-ux-v231.js
          node --check web/graph.js
  layout-and-workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
      options: --ipc=host --init
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install SONIC and Playwright dependencies
        run: python -m pip install -r requirements.txt playwright==1.56.0
      - name: Check Python syntax
        run: python -m py_compile scripts/e2e_ui_v220.py
      - name: Verify graphite theme and static SONIC icon
        run: python -m pytest -q tests/test_ui_v230.py
      - name: Verify v2.3.1 public preview and voice focus contracts
        run: python -m pytest -q tests/test_ui_v231.py
      - name: Test Chat / Artifact Studio / Knowledge desktop + mobile
        env:
          SONIC_QA_BROWSER: ${{ matrix.browser }}
        run: python scripts/e2e_ui_v220.py
      - name: Verify iPhone preview, owner entry and voice focus layout
        env:
          SONIC_QA_BROWSER: ${{ matrix.browser }}
        run: python scripts/e2e_ui_v231.py
      - name: Upload screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonic-ux-v220-${{ matrix.browser }}
          path: |
            artifacts/ux-v220/
            artifacts/ux-v231/
          retention-days: 14
          if-no-files-found: warn
