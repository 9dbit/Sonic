name: SONIC Coding Studio v2.1 Acceptance
on:
  pull_request:
    paths:
      - 'sonic/coding_studio.py'
      - 'sonic/chat_delivery.py'
      - 'sonic/local_ai.py'
      - 'sonic/api.py'
      - 'scripts/windows_local_ai_v152.py'
      - 'web/artifact-studio-v200.js'
      - 'web/artifact-studio-v200.css'
      - 'tests/test_coding_studio_v210.py'
      - 'scripts/e2e_coding_studio_v210.py'
      - '.github/workflows/sonic-coding-v210.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax validation
        run: |
          node --check web/artifact-studio-v200.js
          python -m py_compile sonic/coding_studio.py sonic/chat_delivery.py sonic/local_ai.py scripts/windows_local_ai_v152.py
      - name: Run focused security and regression tests
        run: |
          python -m pytest -q tests/test_coding_studio_v210.py tests/test_chat_delivery_v183.py tests/test_artifact_studio_v200.py
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
      options: --ipc=host --init
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt playwright==1.56.0
      - name: Test explicit AI choice and artifact handoff
        env:
          SONIC_QA_BROWSER: ${{ matrix.browser }}
        run: python scripts/e2e_coding_studio_v210.py
      - name: Upload desktop/iPhone proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonic-coding-v210-${{ matrix.browser }}
          path: artifacts/coding-studio-v210/
          retention-days: 14
          if-no-files-found: warn
